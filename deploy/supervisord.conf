[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
childlogdir=/tmp

[program:auth]
command=node /app/auth/dist/index.js
directory=/app/auth
user=node
environment=NODE_ENV="production",PORT="3003",HOME="/home/node",NODE_OPTIONS="--max-old-space-size=96"
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:socket]
command=node /app/socket/dist/server.js
directory=/app/socket
user=node
environment=NODE_ENV="production",PORT="3002",SOCKET_PORT="3002",HOME="/home/node",NODE_OPTIONS="--max-old-space-size=96"
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:web]
command=node /app/web/server.js
directory=/app/web
user=node
environment=NODE_ENV="production",PORT="3000",HOSTNAME="127.0.0.1",HOME="/home/node",NODE_OPTIONS="--max-old-space-size=192"
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=true
priority=30

[program:proxy]
command=node /app/proxy.js
directory=/app
user=node
environment=NODE_ENV="production",HOME="/home/node",NODE_OPTIONS="--max-old-space-size=48"
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=true
priority=40
