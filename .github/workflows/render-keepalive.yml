name: Render keepalive

on:
  schedule:
    # GitHub's minimum scheduled interval is 5 minutes. Runs are best-effort
    # and can be delayed; use an external uptime monitor as the primary ping.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render liveness endpoint
        env:
          RENDER_LIVE_URL: ${{ secrets.RENDER_LIVE_URL }}
        run: |
          if [ -z "$RENDER_LIVE_URL" ]; then
            echo "RENDER_LIVE_URL is not set. Add it under Settings → Secrets and variables → Actions."
            echo "Expected value: https://<service>.onrender.com/api/live"
            exit 0
          fi

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 20 \
            "$RENDER_LIVE_URL" >/dev/null
          echo "Render liveness ping succeeded."
