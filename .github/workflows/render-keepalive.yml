name: Render keepalive

on:
  schedule:
    # GitHub's minimum scheduled interval is 5 minutes. Scheduled runs are
    # best-effort and can be delayed; an external uptime monitor is the more
    # reliable primary ping. Render sleeps after 15 minutes of inactivity.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render liveness endpoint
        env:
          # Override with a repository secret when the service URL changes.
          RENDER_LIVE_URL: ${{ secrets.RENDER_LIVE_URL || 'https://taskflow-render.onrender.com/api/live' }}
        run: |
          echo "Pinging $RENDER_LIVE_URL"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 20 \
            "$RENDER_LIVE_URL" >/dev/null
          echo "Render liveness ping succeeded."
